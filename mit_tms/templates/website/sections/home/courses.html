<section class="py-24
                bg-gradient-to-r
                from-gray-50
                to-blue-50">

    <div class="max-w-6xl mx-auto px-6">

        <!-- Section Header -->
        <div class="text-center mb-12 fade-up">

            <h2 class="text-3xl
                       font-bold
                       text-gray-800">

                {{ home_courses.title }}

            </h2>

            <p class="text-gray-600
                      mt-4
                      max-w-2xl
                      mx-auto">

                {{ home_courses.description }}

            </p>

        </div>

        <!-- Course Cards -->
        {% include 'website/components/cards/card.html' %}

        <!-- Button -->
        <div class="text-center mt-12">

            <a href="{{ home_courses.button_link }}"
               class="inline-flex
                      items-center
                      px-6
                      py-3
                      rounded-xl
                      bg-indigo-600
                      hover:bg-indigo-700
                      text-white
                      font-medium
                      transition duration-300">

                {{ home_courses.button_text }}

            </a>

        </div>

    </div>

</section>
