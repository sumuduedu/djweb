<section class="py-24
                bg-gradient-to-r
                from-indigo-50
                to-blue-50
                text-center">

    <div class="max-w-6xl mx-auto px-6">

        <!-- Title -->
        <h2 class="text-3xl
                   font-bold
                   text-gray-800
                   mb-12
                   fade-up">

            {{ home_features.title }}

        </h2>

        <!-- Feature Grid -->
        <div class="grid
                    md:grid-cols-3
                    gap-10
                    stagger">

            {% for item in home_features.items %}

                <div class="card
                            bg-white/80
                            backdrop-blur-md
                            border
                            border-gray-200">

                    <div class="text-4xl mb-4">

                        {{ item.icon }}

                    </div>

                    <h3 class="text-xl
                               font-semibold
                               text-gray-800">

                        {{ item.title }}

                    </h3>

                    <p class="text-gray-600 mt-3">

                        {{ item.description }}

                    </p>

                </div>

            {% endfor %}

        </div>

    </div>

</section>
