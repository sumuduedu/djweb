<section class="py-24
                bg-gradient-to-r
                from-blue-50
                to-cyan-50
                text-center">

    <div class="max-w-5xl mx-auto px-6">

        <!-- Title -->
        <h2 class="text-3xl
                   font-bold
                   text-gray-800
                   mb-12
                   fade-up">

            {{ home_testimonials.title }}

        </h2>

        <!-- Testimonials -->
        <div class="grid
                    md:grid-cols-2
                    gap-8
                    stagger">

            {% for item in home_testimonials.items %}

                <div class="card">

                    <div class="text-yellow-400
                                mb-2
                                text-lg">

                        {{ item.rating }}

                    </div>

                    <p class="text-gray-600 italic">

                        "{{ item.message }}"

                    </p>

                    <h4 class="mt-4
                               font-semibold
                               text-blue-600">

                        — {{ item.author }}

                    </h4>

                </div>

            {% endfor %}

        </div>

    </div>

</section>
