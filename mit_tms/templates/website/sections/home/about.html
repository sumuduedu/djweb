{% load static %}

<section id="about"
         class="py-24 bg-gradient-to-b from-white to-blue-50">

    <div class="max-w-6xl
                mx-auto
                px-6
                grid
                md:grid-cols-2
                gap-12
                items-center">

        <!-- Content -->
        <div class="fade-up">

            <h2 class="text-3xl
                       font-bold
                       text-gray-800
                       mb-6">

                {{ home_about.title }}

            </h2>

            <p class="text-gray-600
                      leading-relaxed
                      mb-4">

                {{ home_about.description_1 }}

            </p>

            <p class="text-gray-600">

                {{ home_about.description_2 }}

            </p>

        </div>

        <!-- Image -->
        <div class="fade-up delay-1">

            <img src="{% static home_about.image %}"
                 class="rounded-2xl shadow-xl w-full object-cover"
                 alt="{{ home_about.image_alt }}">

        </div>

    </div>

</section>
