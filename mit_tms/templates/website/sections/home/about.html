{% load static %}

<section id="about"
         class="py-24 bg-gradient-to-b from-white to-blue-50">

    <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">

        <div class="fade-up">

            <h2 class="text-3xl font-bold text-gray-800 mb-6">
                About Our Institute
            </h2>

            <p class="text-gray-600 leading-relaxed mb-4">
                MIT Computer Training Center provides industry-focused ICT education with hands-on experience and real-world projects.
            </p>

            <p class="text-gray-600">
                Our mission is to empower students with practical skills for real career success.
            </p>

        </div>

        <div class="fade-up delay-1">

            <img src="{% static 'images/about.png' %}"
                 class="rounded-2xl shadow-xl w-full object-cover"
                 alt="About MIT">

        </div>

    </div>

</section>
