<section class="bg-gradient-to-r
                from-blue-50
                via-indigo-50
                to-purple-50
                py-16">

    <div class="max-w-6xl
                mx-auto
                px-6
                grid
                grid-cols-2
                md:grid-cols-4
                gap-8
                text-center
                stagger">

        {% for item in home_stats.items %}

            <div>

                <h3 class="text-4xl
                           font-bold
                           {{ item.color }}">

                    {{ item.value }}

                </h3>

                <p class="text-gray-600 mt-2">

                    {{ item.label }}

                </p>

            </div>

        {% endfor %}

    </div>

</section>
