<!-- ============================================== -->
<!-- MOBILE MENU -->
<!-- ============================================== -->

<div
    x-cloak
    x-show="mobileOpen"

    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"

    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"

    class="md:hidden
           border-t border-gray-100
           bg-white/95 backdrop-blur-lg
           shadow-lg"
>

    <div class="px-6 py-5 space-y-4 text-sm font-medium">

        {% for item in website.navigation %}

            <a href="{% url item.url %}"
               class="block hover:text-indigo-600 transition">

                {{ item.name }}

            </a>

        {% endfor %}

        {% if user.is_authenticated %}

            <a href="{% url 'dashboard:dashboard_redirect' %}"
               class="block text-indigo-600 font-semibold">

                Dashboard

            </a>

            <a href="{% url 'accounts:logout' %}"
               class="block text-red-500">

                Logout

            </a>

        {% else %}

            <a href="{% url 'accounts:login' %}"
               class="flex items-center gap-2
                      text-indigo-600 font-semibold">

                Login

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-4 h-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M9 5l7 7-7 7"/>

                </svg>

            </a>

        {% endif %}

    </div>

</div>
