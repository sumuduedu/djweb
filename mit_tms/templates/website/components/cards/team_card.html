{% load static %}

<div class="bg-gray-50 p-6 rounded-2xl shadow hover:shadow-lg transition text-center">

    <div class="w-24 h-24 mx-auto mb-4">

        <img
            src="{% static image %}"
            class="w-full h-full object-cover rounded-full border-4 border-{{ border }}-100"
        >

    </div>

    <h3 class="font-semibold text-gray-800">
        {{ name }}
    </h3>

    <p class="text-sm text-{{ role_color }}-600 mt-1">
        {{ role }}
    </p>

</div>
