<footer class="relative overflow-hidden text-white mt-20">

                bg-gradient-to-r
                from-blue-600
                via-indigo-600
                to-cyan-500">
    </div>

    <!-- Decorative Effects -->
    <div class="absolute -top-24 -left-24
                w-72 h-72
                bg-white/10
                rounded-full
                blur-3xl">
    </div>

    <div class="absolute -bottom-24 -right-24
                w-72 h-72
                bg-cyan-300/20
                rounded-full
                blur-3xl">

                mx-auto
                px-6

        <div class="grid
                    grid-cols-1
                    md:grid-cols-2
                    lg:grid-cols-3
                    gap-12
                    items-start">

            <!-- Brand -->
            <div class="space-y-6">

                {% include 'website/sections/footer/footer_brand.html' %}

                {% include 'website/sections/footer/social_links.html' %}

            </div>

            <!-- Empty Middle Space -->

            <!-- Contact -->
            <div class="lg:justify-self-end">

                {% include 'website/sections/footer/footer_contact.html' %}

            </div>

        </div>

    </div>

    <!-- Bottom Bar -->


<!-- Bottom Bar -->
<!-- Bottom Bar -->
<div class="relative z-10 border-t border-white/5">

    {% include 'website/sections/footer/footer_bottom.html' %}

</div>
