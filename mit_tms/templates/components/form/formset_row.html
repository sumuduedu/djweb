<div class="form-row border p-3 mb-2">

    {% for field in form.visible_fields %}
        {% include "components/form/field.html" with field=field %}
    {% endfor %}

    {% if form.DELETE %}
        {{ form.DELETE }}
    {% endif %}

    <button type="button"
            onclick="removeForm(this)"
            class="bg-red-500 text-white px-2 py-1 rounded">
        ❌ Remove
    </button>

</div>
