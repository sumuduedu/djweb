{% load core_tags %}

{% for rel in relation_layout %}
<div class="border-b pb-4">

    <h3 class="font-semibold mb-3">{{ rel.label }}</h3>

    {% with formset=relation_formsets|get_item:rel.name %}
        {{ formset.management_form }}

        <!-- ✅ CONTAINER -->
        <div id="{{ rel.name }}-container">

            <!-- EXISTING FORMS -->
            {% for f in formset %}
            <div class="form-row border p-3 rounded mb-2 grid grid-cols-5 gap-2">
                {% for field in f %}
                <div>
                    <label class="text-xs text-gray-500">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
            </div>
            {% endfor %}

        </div>

        <!-- ✅ TEMPLATE (MUST BE INSIDE LOOP) -->
        <script type="text/template" id="{{ rel.name }}-empty-form">
            <div class="form-row border p-3 rounded mb-2 grid grid-cols-5 gap-2">
                {% for field in formset.empty_form %}
                <div>
                    <label class="text-xs text-gray-500">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}

                <div class="flex items-end">
                    <button type="button"
                            onclick="removeForm(this)"
                            class="bg-red-500 text-white px-2 py-1 rounded text-xs">
                        Delete
                    </button>
                </div>
            </div>
        </script>

        <!-- ✅ ADD BUTTON -->
        <button type="button"
            onclick="addForm('{{ rel.name }}')"
            class="mt-3 px-3 py-1 bg-green-600 text-white rounded">
            + Add {{ rel.label }}
        </button>

    {% endwith %}

</div>
{% endfor %}
