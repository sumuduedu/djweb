<div class="mb-4">
    {% if field.label %}
        <label class="block text-sm text-gray-600 mb-1">
            {{ field.label }}
        </label>
    {% endif %}

    {{ field }}

    {% if field.help_text %}
        <p class="text-xs text-gray-400">{{ field.help_text }}</p>
    {% endif %}

    {% if field.errors %}
        <p class="text-red-500 text-sm">{{ field.errors }}</p>
    {% endif %}
</div>
