{% load core_tags %}

{% for section, fields in form_layout %}

<div class="bg-gray-50 p-4 rounded-lg mb-6">
    <h3 class="font-semibold mb-3">{{ section }}</h3>

    {% for field_name in fields %}
        {% with field=form|get_field:field_name %}
            {% if field %}
                {% include "components/form/field.html" with field=field %}
            {% endif %}
        {% endwith %}
    {% endfor %}
</div>

{% endfor %}
